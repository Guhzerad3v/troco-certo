<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Troco Certo</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="moeda">R$</div>
    <h1>Troco Certo</h1>
  </header>

  <main>
    <!-- trocar de mês -->
    <nav class="meses">
      <button id="mes-anterior" type="button">&larr;</button>
      <strong id="mes-atual">Carregando...</strong>
      <button id="mes-seguinte" type="button">&rarr;</button>
    </nav>

    <!-- resumo do mês -->
    <section>
      <div class="cartoes">
        <div class="cartao entrada">
          <span>Entradas</span>
          <strong id="total-entradas">R$ 0,00</strong>
        </div>
        <div class="cartao saida">
          <span>Saídas</span>
          <strong id="total-saidas">R$ 0,00</strong>
        </div>
        <div class="cartao imprevisto">
          <span>Imprevistos</span>
          <strong id="total-imprevistos">R$ 0,00</strong>
        </div>
        <div class="cartao saldo">
          <span>Saldo</span>
          <strong id="saldo">R$ 0,00</strong>
        </div>
      </div>
      <label>
        <input id="incluir-imprevistos" type="checkbox">
        Descontar os imprevistos do saldo
      </label>
    </section>

    <!-- novo lançamento -->
    <section>
      <h2>Novo lançamento</h2>
      <form id="formulario">
        <select id="campo-tipo">
          <option value="entrada">Entrada</option>
          <option value="saida" selected>Saída</option>
          <option value="imprevisto">Imprevisto</option>
        </select>
        <input id="campo-descricao" type="text" maxlength="80" placeholder="Descrição" required>
        <input id="campo-valor" type="text" inputmode="decimal" placeholder="Valor (R$)" required>
        <select id="campo-categoria"></select>
        <input id="campo-data" type="date" required>
        <button type="submit">Adicionar</button>
      </form>
      <p id="mensagem" role="status"></p>
    </section>

    <!-- lançamentos do mês -->
    <section>
      <h2>Lançamentos do mês</h2>
      <table>
        <tbody id="lista-lancamentos"></tbody>
      </table>
    </section>
  </main>

  <script src="js/util.js"></script>
  <script src="js/api.js"></script>
  <script src="js/lista.js"></script>
  <script src="js/formulario.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Troco Certo</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="moeda">R$</div>
    <h1>Troco Certo</h1>
  </header>

  <main>
    <!-- trocar de mês -->
    <nav class="meses">
      <button id="mes-anterior" type="button">&larr;</button>
      <strong id="mes-atual">Carregando...</strong>
      <button id="mes-seguinte" type="button">&rarr;</button>
    </nav>

    <!-- resumo do mês: o saldo em destaque e os totais embaixo -->
    <section class="resumo">
      <p class="rotulo">Saldo do mês</p>
      <p id="saldo" class="saldo">R$ 0,00</p>
      <div class="totais">
        <p class="entrada">Entradas<br><strong id="total-entradas">R$ 0,00</strong></p>
        <p class="saida">Saídas<br><strong id="total-saidas">R$ 0,00</strong></p>
        <p class="imprevisto">Imprevistos<br><strong id="total-imprevistos">R$ 0,00</strong></p>
      </div>
      <label>
        <input id="incluir-imprevistos" type="checkbox">
        Descontar os imprevistos do saldo
      </label>
    </section>

    <!-- novo lançamento -->
    <form id="formulario">
      <select id="campo-categoria"></select>
      <input id="campo-descricao" type="text" maxlength="80" placeholder="Descrição" required>
      <input id="campo-valor" type="text" inputmode="decimal" placeholder="Valor (R$)" required>
      <button type="submit">Adicionar</button>
    </form>
    <p id="mensagem" role="status"></p>

    <!-- lançamentos do mês -->
    <table>
      <tbody id="lista-lancamentos"></tbody>
    </table>
  </main>

  <script src="js/util.js"></script>
  <script src="js/api.js"></script>
  <script src="js/lista.js"></script>
  <script src="js/formulario.js"></script>
  <script src="js/resumo.js"></script>
</body>
</html>
